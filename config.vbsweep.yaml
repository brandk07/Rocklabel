# Full-sweep volleyball config: identical to the config the existing
# datasets/VolleyBallTest*.reslam were generated with, EXCEPT that scans
# are merged into 0.05 s windows (one full 20 Hz rotation) instead of one
# raw ~4 ms sensor batch per frame. Everything else - crop box, neighborhood
# geometry, negative_keep_prob, seed - is byte-identical, so a score
# difference against those datasets is the sweep density and nothing else.

topics:
  pointcloud_topic: /multiscan/lidar_scan
  odom_frame: odom
  base_frame: base_link
  lidar_frame: lidar_link
  tf_topic: /tf
  tf_static_topic: /tf_static
  pose_tolerance_s: 0.15
  static_lidar_to_base: null
  min_range_m: 0.0
level:
  mode: auto
  mount_roll_deg: 0.0
  mount_pitch_deg: 0.0
  fit_scans: 0
  range_min_m: 0.6
  range_max_m: 6.0
  fit_voxel_m: 0.05
  plane_thresh_m: 0.05
  ransac_iters: 512
  max_tilt_deg: 50.0
  min_inlier_frac: 0.15
  ceiling_margin_m: 0.2
labeler:
  accumulator_voxel_m: 0.03
  default_rock_radius_m: 0.15
  stride: 1
  z_min: null
  z_max: null
generator:
  frame_stride: 4
  frame_window_s: 0.05
  crop_forward_m: 6.0
  crop_backward_m: 2.0
  crop_left_m: 4.0
  crop_right_m: 4.0
  crop_up_m: 1.5
  crop_down_m: 1.0
  boundary_shell_m: 0.05
  centers_voxel_m: 0.05
  neighborhood_radius_m: 0.5
  min_neighbors: 20
  neighborhood_points: 256
  negative_keep_prob: 0.05
  segmentation_points: 2048
  segmentation_min_points: 512
  bev_cell_m: 0.1
  seed: 42
