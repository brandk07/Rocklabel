# rocklabel configuration - shared by `label`, `driftcheck`, and `generate`.
#
# Every value below is the built-in default; delete anything you don't need to
# change. Precedence: CLI flags > this file > built-in defaults. The fully
# resolved config is hashed into the dataset manifest, so ANY change here
# requires a fresh --out directory for `generate`.

# NOTE: native lidarrig recordings (/lidar/frames) need none of the topics:
# section - poses and reflectivity are embedded per frame and the format is
# auto-detected. topics: only matters for ROS 2 bags.

topics:
  # PointCloud2 topic with the LiDAR scans. If the recording has several
  # PointCloud2 topics, this must be set (run `rocklabel inspect` to list them,
  # with each topic's frame and fields).
  #
  # Raw driver topic vs. a filtered topic from your perception stack: pick the
  # one your classifier will consume at inference time, so training data
  # matches. Raw keeps intensity but includes robot self-hits and reflection
  # ghosts; filtered is clean but may drop intensity. Clouds already expressed
  # in the odom frame (frame_id = odom) work fine - each message's own
  # frame_id is used for the transform.
  pointcloud_topic: /multiscan/lidar_scan

  # Frame IDs as they appear in TF (also shown by `rocklabel inspect`).
  # Note: the frame each point cloud is expressed in comes from the message's
  # own header.frame_id; lidar_frame below is only the fallback for clouds
  # with an empty frame_id, and the frame the static_lidar_to_base fallback
  # mount attaches to.
  odom_frame: odom
  base_frame: base_link
  lidar_frame: lidar_link

  # TF topic names (rarely need changing).
  tf_topic: /tf
  tf_static_topic: /tf_static

  # Max extrapolation (seconds) tolerated when a scan's stamp falls slightly
  # outside the recorded TF range; scans further out are skipped and counted.
  pose_tolerance_s: 0.15

  # Fallback LiDAR mount if the recording is missing the static
  # base_link -> lidar_link transform. Leave null if /tf_static has it.
  # static_lidar_to_base:
  #   translation: [0.20, 0.0, 0.50]     # meters, in base_link
  #   quaternion: [0.0, 0.0, 0.0, 1.0]   # x, y, z, w
  static_lidar_to_base: null

  # Drop points within this xy-distance (meters) of the robot base in every
  # scan - removes LiDAR self-hits on the robot body, which raw driver topics
  # usually include. ~0.7 works for most rovers; 0 disables. Applies to
  # labeling, driftcheck, AND generate, so the view matches the dataset.
  min_range_m: 0.0

labeler:
  # Voxel size of the streaming accumulator that fuses all scans for display.
  # Smaller = denser cloud, more memory.
  accumulator_voxel_m: 0.03

  # Radius (meters) of a newly placed rock sphere; adjust per rock with +/-.
  default_rock_radius_m: 0.15

  # Accumulate every Nth scan (CLI: --stride). 1 = use every scan.
  stride: 1

  # Initial z clipping planes in odom meters (CLI: --z-min / --z-max).
  # null = no clipping; adjust live with [ and ].
  z_min: null
  z_max: null

generator:
  # Keep every Nth scan as a training frame (reduces near-duplicate frames).
  frame_stride: 5

  # Merge all scans within this time window (seconds) into one dataset frame
  # BEFORE frame_stride is applied. 0 = one frame per message. Essential for
  # native lidarrig recordings, whose messages are raw ~4 ms sensor batches
  # (~400 points each): 0.25 fuses ~60 batches into one dense frame.
  # Harmless for ROS 2 bags (their messages are already full scans).
  frame_window_s: 0.0

  # Robot-centered crop box, axis-aligned in the odom frame (deliberately NOT
  # rotated with heading; heading invariance is a training-time augmentation).
  crop_forward_m: 6.0
  crop_backward_m: 2.0
  crop_left_m: 4.0
  crop_right_m: 4.0
  crop_up_m: 1.5
  crop_down_m: 1.0

  # Points inside sphere+shell but outside the sphere are labeled "ignore"
  # (255 in masks, skipped as samples) - the fuzzy rock boundary.
  boundary_shell_m: 0.05

  # --- format A: point-neighborhood samples (points/<run_id>/*.npz) ---
  centers_voxel_m: 0.05        # voxel grid producing candidate center points
  neighborhood_radius_m: 0.5   # gather all points within this radius
  min_neighbors: 20            # discard sparser candidates
  neighborhood_points: 256     # fixed sample size (subsample / pad-by-repeat)
  negative_keep_prob: 0.05     # keep this fraction of clear samples (all rocks kept)

  # --- format B: BEV rasters (bev/<run_id>/*.npz) ---
  bev_cell_m: 0.10             # with the default crop: 80 x 80 cells

  # RNG seed for negative subsampling and neighborhood subsample/pad.
  seed: 42
